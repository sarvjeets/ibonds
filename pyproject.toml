[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ibonds"
version = "1.0.9"
description = "Library to calculate the current value of a Series I Savings bond (I Bond)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sarvjeet Singh", email = "sarvjeet@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PyYAML~=6.0",
    "requests~=2.28",
]

[project.urls]
Homepage = "https://github.com/sarvjeets/ibonds"

[tool.setuptools]
packages = ["ibonds"]

[tool.setuptools.package-data]
ibonds = ["interest_rates.yaml"]
